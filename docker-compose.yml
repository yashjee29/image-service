services:
  image-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cash-mod-image-service
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_MAX_ENTRIES=${CACHE_MAX_ENTRIES:-500}
      - CACHE_MAX_BYTES=${CACHE_MAX_BYTES:-104857600}
      - CACHE_TTL_MS=${CACHE_TTL_MS:-60000}
      - MAX_CONCURRENT_RENDERS=${MAX_CONCURRENT_RENDERS:-4}
      - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE:-50}
      - RENDER_TIMEOUT_MS=${RENDER_TIMEOUT_MS:-10000}
      - ASSET_FETCH_TIMEOUT_MS=${ASSET_FETCH_TIMEOUT_MS:-5000}
      - MAX_ASSET_SIZE_BYTES=${MAX_ASSET_SIZE_BYTES:-10485760}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
