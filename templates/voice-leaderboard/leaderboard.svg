<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 835" width="100%" height="100%">
  <defs>
    <style>
      .font-main {
        font-family: 'Plus Jakarta Sans', 'Inter', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .title-dark { fill: #0B1528; font-weight: 800; letter-spacing: -0.02em; }
      .stat-num { fill: #0E1726; font-weight: 700; letter-spacing: -0.02em; }
      .section-header { fill: #1A5096; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; }
      .sub-header { fill: #1A5096; font-size: 13px; font-weight: 500; }
      .pill-text { font-size: 12px; font-weight: 700; }
    </style>

    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#4361EE" />
    </linearGradient>

    <!-- Podium Gradients -->
    <linearGradient id="gold-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9DB" />
      <stop offset="100%" stop-color="#FFE8CC" />
    </linearGradient>
    <linearGradient id="silver-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F3F5" />
      <stop offset="100%" stop-color="#E9ECEF" />
    </linearGradient>
    <linearGradient id="bronze-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0F6" />
      <stop offset="100%" stop-color="#FFE3E3" />
    </linearGradient>

    <linearGradient id="gold-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD43B" />
      <stop offset="100%" stop-color="#F59F00" />
    </linearGradient>
    <linearGradient id="silver-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CED4DA" />
      <stop offset="100%" stop-color="#ADB5BD" />
    </linearGradient>
    <linearGradient id="bronze-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA8A8" />
      <stop offset="100%" stop-color="#FF6B6B" />
    </linearGradient>

    <!-- Avatar clip paths for podiums -->
    <clipPath id="avatar-clip-1"><circle cx="600" cy="225" r="42" /></clipPath>
    <clipPath id="avatar-clip-2"><circle cx="230" cy="235" r="36" /></clipPath>
    <clipPath id="avatar-clip-3"><circle cx="970" cy="235" r="36" /></clipPath>
  </defs>

  <g class="font-main">
    <!-- Main Outer Container -->
    <rect x="20" y="30" width="1160" height="772" rx="36" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- ==================== HEADER ==================== -->
    <g transform="translate(60, 60)">
      <!-- Trophy Icon -->
      <g transform="translate(0, 4)">
        <path d="M10 6 H30 V20 C30 27 25 32 20 32 C15 32 10 27 10 20 Z" fill="#F59F00" />
        <path d="M10 11 H5 C3 11 2 13 2 15 C2 21 6 25 12 26" fill="none" stroke="#F59F00" stroke-width="3" stroke-linecap="round" />
        <path d="M30 11 H35 C37 11 38 13 38 15 C38 21 34 25 28 26" fill="none" stroke="#F59F00" stroke-width="3" stroke-linecap="round" />
        <rect x="18" y="31" width="4" height="8" fill="#F59F00" />
        <rect x="12" y="38" width="16" height="4" rx="2" fill="#E67700" />
      </g>

      <!-- Title & Subtitle -->
      <text x="56" y="28" font-size="28" class="title-dark">{{TITLE}}</text>
      <text x="56" y="48" class="sub-header">{{SUBTITLE}}</text>

      <!-- Period Badge -->
      <g transform="translate(930, 10)">
        <rect x="0" y="0" width="150" height="36" rx="18" fill="#F3EEFF" stroke="#D5CAFF" stroke-width="1.2" />
        <text x="75" y="23" text-anchor="middle" fill="#7B2CBF" class="pill-text">{{PERIOD}}</text>
      </g>
    </g>

    <!-- ==================== PODIUM SECTION (TOP 3) ==================== -->
    <g id="podium-section">
      <!-- PODIUM #2 (Silver) -->
      <g id="podium-rank-2" transform="translate(60, 145)">
        <rect x="0" y="0" width="340" height="235" rx="22" fill="url(#silver-grad)" stroke="url(#silver-border)" stroke-width="1.5" />
        <circle cx="170" cy="90" r="40" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2" />
        <!-- Avatar Slot 2 -->
        <g id="podium-avatar-2">
          <circle cx="170" cy="90" r="36" fill="#CED4DA" />
          <text x="170" y="97" font-size="20" font-weight="700" fill="#495057" text-anchor="middle">#2</text>
        </g>
        <circle cx="205" cy="115" r="14" fill="#6C757D" />
        <text x="205" y="120" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
        <text x="170" y="160" font-size="20" font-weight="700" fill="#0B1528" text-anchor="middle" id="podium-user-2">Player 2</text>
        <text x="170" y="185" font-size="16" font-weight="700" fill="#495057" text-anchor="middle" id="podium-hours-2">0h 0m</text>
        <rect x="120" y="198" width="100" height="22" rx="11" fill="#E9ECEF" />
        <text x="170" y="213" font-size="11" font-weight="600" fill="#495057" text-anchor="middle" id="podium-badge-2">Silver</text>
      </g>

      <!-- PODIUM #1 (Gold - Center) -->
      <g id="podium-rank-1" transform="translate(430, 130)">
        <rect x="0" y="0" width="340" height="250" rx="22" fill="url(#gold-grad)" stroke="url(#gold-border)" stroke-width="2" />
        <!-- Crown -->
        <path d="M152 28 L158 14 L170 22 L182 14 L188 28 Z" fill="#F59F00" stroke="#F59F00" stroke-width="1" stroke-linejoin="round" />
        <circle cx="170" cy="95" r="46" fill="#FFFFFF" stroke="#F59F00" stroke-width="2.5" />
        <!-- Avatar Slot 1 -->
        <g id="podium-avatar-1">
          <circle cx="170" cy="95" r="42" fill="#FFE066" />
          <text x="170" y="103" font-size="24" font-weight="800" fill="#F08C00" text-anchor="middle">#1</text>
        </g>
        <circle cx="210" cy="125" r="16" fill="#F59F00" />
        <text x="210" y="131" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
        <text x="170" y="172" font-size="22" font-weight="800" fill="#0B1528" text-anchor="middle" id="podium-user-1">Player 1</text>
        <text x="170" y="198" font-size="18" font-weight="800" fill="#D9480F" text-anchor="middle" id="podium-hours-1">0h 0m</text>
        <rect x="110" y="212" width="120" height="24" rx="12" fill="#FFF3BF" />
        <text x="170" y="228" font-size="12" font-weight="700" fill="#E67700" text-anchor="middle" id="podium-badge-1">Champion</text>
      </g>

      <!-- PODIUM #3 (Bronze) -->
      <g id="podium-rank-3" transform="translate(800, 145)">
        <rect x="0" y="0" width="340" height="235" rx="22" fill="url(#bronze-grad)" stroke="url(#bronze-border)" stroke-width="1.5" />
        <circle cx="170" cy="90" r="40" fill="#FFFFFF" stroke="#FFA8A8" stroke-width="2" />
        <!-- Avatar Slot 3 -->
        <g id="podium-avatar-3">
          <circle cx="170" cy="90" r="36" fill="#FFC9C9" />
          <text x="170" y="97" font-size="20" font-weight="700" fill="#E03131" text-anchor="middle">#3</text>
        </g>
        <circle cx="205" cy="115" r="14" fill="#E03131" />
        <text x="205" y="120" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
        <text x="170" y="160" font-size="20" font-weight="700" fill="#0B1528" text-anchor="middle" id="podium-user-3">Player 3</text>
        <text x="170" y="185" font-size="16" font-weight="700" fill="#C92A2A" text-anchor="middle" id="podium-hours-3">0h 0m</text>
        <rect x="120" y="198" width="100" height="22" rx="11" fill="#FFE3E3" />
        <text x="170" y="213" font-size="11" font-weight="600" fill="#C92A2A" text-anchor="middle" id="podium-badge-3">Bronze</text>
      </g>
    </g>

    <!-- ==================== TABLE SECTION (RANKS 4-10) ==================== -->
    <g id="table-section" transform="translate(60, 410)">
      <rect x="0" y="0" width="1080" height="365" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />

      <!-- Table Header -->
      <text x="30" y="32" class="section-header">RANKS 4 – 10</text>
      <line x1="30" y1="46" x2="1050" y2="46" stroke="#E2E8F0" stroke-width="1" />

      <!-- Injected Rows (Generated dynamically) -->
      <g id="table-rows">
        <!-- ROWS_PLACEHOLDER -->
      </g>
    </g>
  </g>
</svg>
